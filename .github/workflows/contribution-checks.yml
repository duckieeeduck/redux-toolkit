name: Contribution checks
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Contribution branch or commit to check
        required: true
        type: string
      suite:
        description: Verification scope
        required: true
        default: regression
        type: choice
        options:
          - regression
          - focused
          - full

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
      - run: pnpm install --frozen-lockfile
      - name: Regression tests
        if: inputs.suite == 'regression'
        run: pnpm --filter @reduxjs/toolkit test src/query/tests/refetchOptions.test.ts
      - name: Related behavior tests
        if: inputs.suite == 'focused'
        run: pnpm --filter @reduxjs/toolkit test src/query/tests/refetchOptions.test.ts src/query/tests/buildInitiate.test.tsx src/query/tests/polling.test.tsx src/query/tests/refetchingBehaviors.test.tsx src/query/tests/buildThunks.test.tsx
      - name: Package tests
        if: inputs.suite == 'full'
        run: pnpm test
      - name: Lint
        if: inputs.suite != 'regression'
        run: pnpm lint
      - name: Format check
        if: inputs.suite != 'regression'
        run: pnpm format:check
      - name: Build packages
        if: inputs.suite == 'full'
        run: pnpm build
